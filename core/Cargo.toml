[package]
name = "imesde"
version = "0.3.0"
edition = "2024"

[lib]
name = "imesde"
path = "src/lib.rs"

[[bin]]
name = "imesde"
path = "src/main.rs"

[dependencies]
arc-swap = "1.7.1"
fxhash = "0.2.1"
ndarray = "0.16.1"
ort = "2.0.0-rc.10"
crossbeam-queue = "0.3.12"
num_cpus = "1.16.0"
rayon = "1.11.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
candle-core = "0.8.2"
candle-nn = "0.8.2"
candle-transformers = "0.8.2"
hf-hub = "0.4.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.148"
dashmap = "6.1.0"
